default:
  # golem variables
  golem_name: apscp
  golem_version: 0.0.0.9000
  app_prod: no

  ## future plan strategy
  ### if "auto", then:
  ###   if on Shiny apps (per R_CONFIG_ACTIVE variable): "multicore"
  ###   else if on Unix systems: "multicore"
  ###   else "multisession"
  strategy: "auto"

  ## verbosity
  verbose: false

  ## logging
  logging: false

  ## define options for generating different solutions
  prioritization_feature_weights:
    - 0.0
    - 0.5
    - 1.0
  prioritization_feature_targets:
    - 0.0 # minimum value
    - 1.0 # maximum value
    - 0.2 # step value
  prioritization_cost_weights:
    - 0.0 # minimum value
    - 1.0 # maximum value
    - 0.25 # step value

  ## map details
  map_style: "satellite"
  map_min_zoom: 0
  map_max_zoom: 10

  ## solver details
  solver_gap: 0.01 # optimality gap, e.g., 0.01 = 1%
  solver_time_limit: 300 # in seconds
  solver_gurobi_server: null

  ## time out (seconds) for worker processes
  ## i.e. maximum time that worker process should remain active after
  ## contacting controller process
  worker_time_out: 7200 # two hours

  ## tile server details
  tile_server_url: "http://localhost:8085/"
  tile_server_port: 8085
  tile_server_dir: null
  tile_max_zoom: 8

  ## define color palette used for zones in solutions
  ### note that if more colors are defined than zones, then only
  ### the first set of color values are used
  zone_colors:
    - "#4daf4a"
    - "#f781bf"
    - "#377eb8"
    - "#ff7f00"
    - "#984ea3"
    - "#ffff33"
    - "#a65628"
    - "#999999"
    - "#e41a1c"

# production configuration:
prod:
  app_prod: yes
  tile_server_dir: tiles
  solver_gurobi_server: "localhost:61000"

# development configuration
dev:
  golem_wd: !expr here::here()
  logging: true
  verbose: true
  solver_gap: 0.3
