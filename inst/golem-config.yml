default:
  # golem variables
  golem_name: apscp
  golem_version: 0.0.0.9000
  app_prod: no

  ## file name for project data
  project_filename: "antarctic-peninsula.yml"

  ## future plan strategy
  ### if "auto", then:
  ###   if on Shiny apps (per R_CONFIG_ACTIVE variable): "multicore"
  ###   else if on Unix systems: "multicore"
  ###   else "multisession"
  strategy: "auto"

  ## verbosity
  verbose: false

  ## monitor memory usage
  monitor: false

  ## optimality gap
  solver_gap: 0.01 # 1% from optimality for initial optimization

  ## time limit (seconds) for generating solutions
  solver_time_limit: 300 # 5 minutes for spatial clustering optimization

  ## time out (seconds) for worker processes
  ## i.e. maximum time that worker process should remain active after
  ## contacting controller process
  worker_time_out: 7200 # two hours

  ## tile server details
  tile_server_url: "http://localhost:8080/"
  tile_server_port: 8080
  tile_server_dir: null
  tile_max_zoom: 8

# production configuration:
prod:
  app_prod: yes
  tile_server_dir: tiles

# development configuration
dev:
  golem_wd: !expr here::here()
  monitor: true
