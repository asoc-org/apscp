default:
  # golem variables
  golem_name: apscp
  golem_version: 0.0.0.9000
  app_prod: no

  ## number of asynchronous workers for asynchronous processing
  ### note that this should be equal to the number of expected users
  async_workers: 2

  ## verbosity
  verbose: false

  ## logging
  logging: false

  ## define options for generating different solutions
  prioritization_feature_weights:
    - 0.0
    - 0.5
    - 1.0
  prioritization_feature_targets:
    - 0.0 # minimum value
    - 1.0 # maximum value
    - 0.2 # step value
  prioritization_cost_weights:
    - 0.0 # minimum value
    - 1.0 # maximum value
    - 0.25 # step value

  ## map details
  map_style: "satellite"
  map_min_zoom: 0
  map_max_zoom: 10

  ## solver details
  solver_gap: 0.1 # optimality gap, e.g., 0.01 = 1%
  solver_time_limit: 300 # in seconds
  solver_name: "cbc"

  ## time out (seconds) for worker processes
  ## i.e. maximum time that worker process should remain active after
  ## contacting controller process
  worker_time_out: 7200 # two hours

  ## tile server details
  tile_server_mode: "internal"
  tile_server_url: "http://localhost:8085"
  tile_server_dir: !expr file.path(tempdir(), "tiles")
  tile_max_zoom: 8

  ## tile processing details
  tile_engine: "r"

  ## define color palette used for zones in solutions
  ### note that if more colors are defined than zones, then only
  ### the first set of color values are used
  zone_colors:
    - "#4daf4a"
    - "#377eb8"
    - "#f781bf"
    - "#ff7f00"
    - "#984ea3"
    - "#ffff33"
    - "#a65628"
    - "#e41a1c"
    - "#525252"

  ## define color palette used for locking zones in solutions
  ### note that if more colors are defined than zones, then only
  ### the first set of color values are used. also, these colors
  ### were generated with the following code:
  ### dput(colorspace::lighten(get_golem_config("zone_colors"), 0.85))
  zone_locked_colors:
    - "#C0FFBF"
    - "#DEEBFF"
    - "#FEEDF5"
    - "#FFEDE8"
    - "#F9DFFF"
    - "#FFFFEB"
    - "#FFE1D9"
    - "#FFE2E3"
    - "#E3E3E3"

# development configuration
## this is intended for running locally outside of a docker environment
dev:
  logging: true
  verbose: true
  solver_gap: 0.3

# demo configuration
## this is intended for running within the launcher on demo mode
demo:
  app_prod: yes
  logging: true
  verbose: true
  tile_server_mode: "external"
  tile_server_url: !expr Sys.getenv("TILE_SERVER_URL")
  tile_server_dir: !expr path.expand("~/tiles")
  async_workers: !expr as.numeric(Sys.getenv("ASYNC_WORKERS"))
  solver_name: !expr Sys.getenv("SOLVER_NAME")
  solver_gurobi_server: "http://compute:61000"
  tile_engine: "rust"

# production configuration
## this is intended for running within the launcher on prod mode
prod:
  app_prod: yes
  tile_server_mode: "external"
  tile_server_url: !expr Sys.getenv("TILE_SERVER_URL")
  tile_server_dir: !expr path.expand("~/tiles")
  async_workers: !expr as.numeric(Sys.getenv("ASYNC_WORKERS"))
  solver_name: !expr Sys.getenv("SOLVER_NAME")
  solver_gurobi_server: "http://compute:61000"
  tile_engine: "rust"
