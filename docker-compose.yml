services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: shiny
    image: jhansonasoc/apscp
    ports:
      - "3838:3838"
    environment:
      - MAPBOX_PUBLIC_TOKEN
      - R_CONFIG_ACTIVE
    volumes:
      - "${GUROBI_LICENSE_PATH}:/opt/gurobi/gurobi.lic:ro"
      - "./inst/tiles:/home/shiny/tiles"
