services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: shiny
    image: jhansonasoc/apscp
    profiles:
      - ''
    ports:
      - "3838:3838"
    environment:
      - R_CONFIG_ACTIVE
      - MAPBOX_PUBLIC_TOKEN
      - TILE_SERVER_URL
      - ASYNC_WORKERS
      - SOLVER_NAME
    volumes:
      - "${GUROBI_LICENSE_PATH}:/opt/gurobi/gurobi.lic:ro"
      - "./inst/tiles:/home/shiny/tiles"
  compute:
    image: gurobi/compute:13.0.3
    profiles:
      - compute
    environment:
      - ConsoleLogging=1
      - JOBLIMIT=1
    hostname: localhost
    ports:
      - "61000:61000"
    volumes:
      - "${GUROBI_LICENSE_PATH}:/opt/gurobi/gurobi.lic:ro"
