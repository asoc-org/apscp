url: https://asoc-org.github.io/apscp/

template:
  bootstrap: 5
  math-rendering: katex

home:
  sidebar:
    structure: [links, citation, license, authors, dev]
  links:
    - text: Learn about contributing
      href: https://asoc-org.github.io/apscp/CONTRIBUTING.html

navbar:
  structure:
    left:  [home, intro, reference, articles, news]
    right: [search, github]
    articles:
      text: Advanced topics
      menu:
      - text: Optimization
        href: articles/optimization.html

reference:
  - title: Overview
    desc: Overview of the package.
    contents:
      - apscp

  - title: Applications
    desc: >
      Functions for launching applications.
    contents:
      - run_app
      - run_example_app

  - title: Classes and methods
    desc: >
      Functions and definitions for new classes.
    contents:
      - has_concept("class")
      - has_concept("method")

  - title: Prioritization
    desc: >
      Functions for prioritization.
    contents:
      - has_concept("prioritization")

  - title: Mapping
    desc: >
      Functions for creating maps.
    contents:
      - has_concept("mapping")

  - title: Reading and writing
    desc: >
      Functions for reading and writing from disk and memory.
    contents:
      - has_concept("io")

  - title: Sidebar widget
    desc: >
      Functions for sidebar widget.
    contents:
      - has_concept("sidebar")

  - title: Mapper widget
    desc: >
      Functions for widget to control map.
    contents:
      - has_concept("mapper")

  - title: Solver widget
    desc: >
      Functions for widget to control solution settings.
    contents:
      - has_concept("solver")

  - title: Summarizer widget
    desc: >
      Functions for widget to summarize solutions.
    contents:
      - has_concept("summarizer")

  - title: Tile server
    desc: >
      Functions for creating a tile server.
    contents:
      - has_concept("tile_server")

  - title: Asynchronous processing
    desc: >
      Functions for asynchronous processing
    contents:
      - has_concept("async")

  - title: Simulation
    desc: >
      Functions for simulating data.
    contents:
      - has_concept("simulation")

  - title: Miscellaneous functions
    desc: >
      Functions with assorted uses.
    contents:
      - has_concept("misc")
      - add_external_resources
