name: Test coverage

on:
  schedule:
    - cron: 0 0 * * 1
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: '4.6.0'}

    env:
      NANONEXT_LIBS: 1
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CI: true

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get -y install cmake curl gdal-bin htop libuv1-dev libglpk-dev libabsl-dev libsqlite3-mod-spatialite libcurl4-gnutls-dev libssl-dev libudunits2-dev libgdal-dev libgeos-dev libproj-dev coinor-libcbc-dev coinor-libclp-dev coinor-libsymphony-dev coinor-libcgl-dev libharfbuzz-dev libfribidi-dev libfontconfig1-dev

      - name: Install dependencies
        run: |
          options(install.packages.compile.from.source = "never")
          install.packages(c("renv", "remotes", "testthat", "rvest"))
          renv::restore()
          remotes::install_cran("rcmdcheck")
          remotes::install_cran("covr")
        shell: Rscript {0}

      - name: Session information
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' && true || false }}
          file: ./cobertura.xml
          plugin: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
