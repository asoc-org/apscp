name: Build and deploy website

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]
  workflow_dispatch:

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NANONEXT_LIBS: 1
      CI: true

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get -y install cmake curl gdal-bin htop libuv1-dev libglpk-dev libabsl-dev libsqlite3-mod-spatialite libcurl4-gnutls-dev libssl-dev libudunits2-dev libgdal-dev libgeos-dev libproj-dev coinor-libcbc-dev coinor-libclp-dev coinor-libsymphony-dev coinor-libcgl-dev libharfbuzz-dev libfribidi-dev libfontconfig1-dev

      - name: Install dependencies
        run: |
          options(install.packages.compile.from.source = "never")
          install.packages(c("renv", "remotes", "testthat", "rvest"))
          renv::restore()
          remotes::install_cran("rcmdcheck")
          remotes::install_cran("covr")
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Session information
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
